<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message sent — Tony DeFazio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231B1719'/%3E%3Cpath d='M7 20.5h4.2l2.1-8 2.6 11 2.6-14.5 2.3 11.5h4.2' fill='none' stroke='%23F3F2EF' stroke-width='2.1' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Palette and type inherited from murderboard.tonydefazio.com, which is the
   most fully designed of the six destinations. This page is deliberately the
   parent of that language rather than a sixth dialect: same paper, same
   Charter body, same mono kickers. What it adds is one accent hue per
   destination, so a card is recognisable before its title is read.
   ========================================================================== */
:root {
  --bg:        #F3F2EF;
  --surface:   #FFFFFF;
  --surface-2: #EBE9E5;
  --ink:       #1B1719;
  --ink-soft:  #5C5459;
  --ink-faint: #695F63;
  --rule:      #D8D4CE;
  --rule-soft: #E6E3DD;
  --blood:     #8A1C2B;
  --shadow:    0 1px 2px rgba(27,23,25,.05), 0 8px 24px -16px rgba(27,23,25,.22);
  --shadow-lift: 0 2px 4px rgba(27,23,25,.06), 0 18px 40px -24px rgba(27,23,25,.34);

  /* One hue per destination, each taken from that site's own accent.
     Light values are all >= 4.5:1 on --surface, so they carry body-size text. */
  --c-kernel: #7A1FC4;   /* colonel_kernel's --accent-solid   */
  --c-nopeak: #1F63B8;   /* no_peak's --accent, darkened to clear AA on white */
  --c-bugarach: #0E6674; /* bugarach's site is neutral; teal is this page's assignment */
  --c-murderboard: #8A1C2B; /* murderboard's --blood */

  --f-display: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Display",
               "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-body:    Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype",
               Palatino, "Book Antiqua", Georgia, "Liberation Serif", serif;
  --f-mono:    ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", "Roboto Mono",
               Menlo, Consolas, "Liberation Mono", monospace;

  --measure: 62ch;
  --pad: clamp(1.4rem, 4.5vw, 2.75rem);
}

html { font-size: 17px; }
@media (max-width: 760px) { html { font-size: 18.5px; } }
@media (max-width: 380px) { html { font-size: 18px; } }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #141215;
    --surface:   #1C191D;
    --surface-2: #232025;
    --ink:       #EDE9E6;
    --ink-soft:  #A79EA1;
    --ink-faint: #8D868A;
    --rule:      #342F35;
    --rule-soft: #262227;
    --blood:     #E0808C;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.5), 0 22px 46px -22px rgba(0,0,0,.9);
    --c-kernel: #C79BF5;
    --c-nopeak: #8FBDEE;
    --c-bugarach: #6BC6D4;
    --c-murderboard: #E0808C;
  }
}
:root[data-theme="dark"] {
  --bg:        #141215;
  --surface:   #1C191D;
  --surface-2: #232025;
  --ink:       #EDE9E6;
  --ink-soft:  #A79EA1;
  --ink-faint: #8D868A;
  --rule:      #342F35;
  --rule-soft: #262227;
  --blood:     #E0808C;
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.5), 0 22px 46px -22px rgba(0,0,0,.9);
  --c-kernel: #C79BF5;
  --c-nopeak: #8FBDEE;
  --c-bugarach: #6BC6D4;
  --c-murderboard: #E0808C;
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1rem;
  line-height: 1.6;
  margin: 0;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: var(--pad); }

p { margin: 0 0 1.05em; }
p:last-child { margin-bottom: 0; }
a { color: var(--blood); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 2px; }
strong { font-weight: 600; }

/* ---------- masthead ---------- */
.masthead { padding-block: clamp(3rem, 9vw, 6rem) clamp(1.75rem, 4vw, 2.75rem); }

.kicker {
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-faint);
  margin: 0 0 clamp(1.5rem, 4vw, 2.4rem);
  display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: baseline;
}

.wordmark {
  font-family: var(--f-display); font-weight: 800;
  font-size: clamp(2.6rem, 9.5vw, 5.6rem);
  line-height: .95; letter-spacing: -.034em; margin: 0;
  text-wrap: balance; max-width: 17ch;
}
.wordmark em { font-style: normal; color: var(--blood); }

.deck {
  margin: clamp(1.4rem, 3.2vw, 2rem) 0 0; max-width: 58ch;
  color: var(--ink-soft); line-height: 1.5; font-size: 1.07rem;
}
.deck b { color: var(--ink); font-weight: 600; }

/* ---------- the six cards ---------- */
.shelf {
  padding-block: 0 clamp(2.5rem, 6vw, 4rem);
  display: grid; gap: 1.15rem;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 27rem), 1fr));
}

.card {
  --c: var(--ink);
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-top: 3px solid var(--c);
  border-radius: 3px;
  padding: clamp(1.3rem, 3.2vw, 1.9rem);
  box-shadow: var(--shadow);
  color: inherit; text-decoration: none;
  transition: box-shadow .16s ease, border-color .16s ease, transform .16s ease;
}
.card:hover, .card:focus-visible {
  box-shadow: var(--shadow-lift);
  border-color: var(--c);
  border-top-color: var(--c);
  transform: translateY(-2px);
}
.card:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }

.card .eyebrow {
  font-family: var(--f-mono); font-size: .68rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--c); margin: 0 0 .75rem;
}
.card h2 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(1.42rem, 3.4vw, 1.85rem); line-height: 1.1;
  letter-spacing: -.026em; margin: 0 0 .65rem; text-wrap: balance;
}
.card .what { color: var(--ink); font-size: 1.01rem; line-height: 1.5; margin: 0 0 .85rem; }
.card .why  { color: var(--ink-soft); font-size: .95rem; line-height: 1.5; margin: 0 0 1.15rem; }

.facts {
  list-style: none; margin: 0 0 1.2rem; padding: 0;
  display: flex; flex-wrap: wrap; gap: .4rem;
  font-family: var(--f-mono); font-size: .71rem; letter-spacing: .02em;
}
.facts li {
  border: 1px solid var(--rule); border-radius: 999px;
  padding: .28rem .7rem; color: var(--ink-faint); background: var(--surface-2);
}

.go {
  margin-top: auto; padding-top: .9rem; border-top: 1px solid var(--rule-soft);
  font-family: var(--f-mono); font-size: .78rem; color: var(--c);
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
}
.go .arrow { font-family: var(--f-display); font-weight: 700; }
.card:hover .arrow { transform: translateX(2px); }

/* ---------- the common thread ---------- */
.thread { border-top: 1px solid var(--rule); padding-block: clamp(2.5rem, 6vw, 4rem); }
.thread .eyebrow {
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--blood); margin: 0 0 .9rem;
}
.thread h2 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(1.55rem, 3.8vw, 2.2rem); line-height: 1.13;
  letter-spacing: -.028em; margin: 0 0 1.1rem; max-width: 22ch; text-wrap: balance;
}
.thread p { max-width: var(--measure); color: var(--ink-soft); }
.thread p b { color: var(--ink); }

.points { list-style: none; margin: 2rem 0 0; padding: 0; display: grid; gap: 0; }
.points li {
  display: grid; grid-template-columns: 11rem 1fr; gap: .35rem 1.4rem;
  padding: 1.05rem 0; border-top: 1px solid var(--rule-soft);
  color: var(--ink-soft); font-size: .98rem;
}
.points li:first-child { border-top: none; }
.points .t {
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink); padding-top: .28rem;
}
@media (max-width: 620px) {
  .points li { grid-template-columns: 1fr; }
  .points .t { padding-top: 0; }
}

/* ---------- footer ---------- */
footer { border-top: 1px solid var(--rule); padding-block: clamp(2.25rem, 5vw, 3.25rem) clamp(3rem, 6vw, 4.5rem); }
.foot-grid {
  display: grid; gap: 1.75rem 3rem;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr));
  align-items: start;
}
footer h3 {
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-faint); font-weight: 400; margin: 0 0 .7rem;
}
footer ul { list-style: none; margin: 0; padding: 0; }
footer li { margin: 0 0 .38rem; font-size: .95rem; }
footer li:last-child { margin-bottom: 0; }
.colophon {
  margin-top: clamp(2rem, 4vw, 3rem); padding-top: 1.1rem;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--f-mono); font-size: .72rem; line-height: 1.7;
  color: var(--ink-faint); max-width: 74ch;
}

/* ---------- contact ---------- */
.contact-sec { border-top: 1px solid var(--rule); padding-block: clamp(2.5rem, 6vw, 4rem); }
.contact-sec .eyebrow {
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--blood); margin: 0 0 .9rem;
}
.contact-sec h2 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(1.55rem, 3.8vw, 2.2rem); line-height: 1.13;
  letter-spacing: -.028em; margin: 0 0 1.1rem; max-width: 22ch; text-wrap: balance;
}
.contact-sec .wrap-in { display: grid; gap: clamp(1.5rem, 4vw, 3rem);
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); align-items: start; }
.contact-sec p { max-width: 46ch; color: var(--ink-soft); }
.contact-sec p b { color: var(--ink); }

form.contact { display: grid; gap: .85rem; max-width: 34rem; }
form.contact label {
  display: grid; gap: .35rem;
  font-family: var(--f-mono); font-size: .72rem; letter-spacing: .13em;
  text-transform: uppercase; color: var(--ink-faint);
}
form.contact input[type="email"], form.contact textarea {
  font-family: var(--f-body); font-size: 1rem; line-height: 1.5; color: var(--ink);
  background: var(--surface); border: 1px solid var(--rule); border-radius: 3px;
  padding: .6rem .7rem; width: 100%;
  text-transform: none; letter-spacing: normal;
}
form.contact input[type="email"]:focus, form.contact textarea:focus {
  outline: 2px solid var(--blood); outline-offset: 1px; border-color: var(--blood);
}
form.contact textarea { resize: vertical; min-height: 7rem; }
/* Honeypot: hidden from people, irresistible to bots. */
form.contact .botcheck { position: absolute; left: -9999px; opacity: 0; height: 0; width: 0; }
form.contact button {
  font-family: var(--f-display); font-weight: 600; font-size: .95rem;
  background: var(--blood); color: var(--surface); border: 1px solid var(--blood);
  border-radius: 3px; padding: .6rem 1.4rem; cursor: pointer; justify-self: start;
  transition: opacity .15s;
}
form.contact button:hover { opacity: .88; }
form.contact button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
:root[data-theme="dark"] form.contact button,
:root:not([data-theme="light"]) form.contact button { color: #1B1719; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) form.contact button { color: #fff; } }
.formnote { font-family: var(--f-mono); font-size: .72rem; line-height: 1.6;
  color: var(--ink-faint); margin: .3rem 0 0; max-width: 44ch; }
</style>
</head>
<body>
<header class="masthead wrap">
  <p class="kicker"><span>tonydefazio.com</span></p>
  <h1 class="wordmark">Message <em>sent</em>.</h1>
  <p class="deck">
    Thanks &mdash; it reached me. If it needs a reply you&rsquo;ll get one at the address you
    gave. <b>Nothing else was sent</b>: the form carries only what you typed into it.
  </p>
  <p class="jumpback">
    <a href="/">&larr; Back to the projects</a>
  </p>
</header>
<style>
  .jumpback { margin-top: clamp(2rem, 5vw, 3rem); font-family: var(--f-mono); font-size: .8rem; }
  .jumpback a { text-decoration: none; border: 1px solid var(--rule); border-radius: 999px;
    padding: .45rem .95rem; color: var(--ink-soft); background: var(--surface); }
  .jumpback a:hover { color: var(--blood); border-color: var(--blood); }
</style>
</body>
</html>
